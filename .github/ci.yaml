name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]
    # This ensures the pipeline only runs if you actually change app code
    paths:
      - 'frontend/**'
      - 'backend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Backend image
      uses: docker/build-push-action@v4
      with:
        context: ./backend    # Points to your backend folder
        push: true

        tags: dockerpawan09/employee-backend:${{ github.sha }}, dockerpawan09/employee-backend:latest

    - name: Build and push Frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend   # Points to your frontend folder
        push: true
        
        tags: dockerpawan09/employee-frontend:${{ github.sha }}, dockerpawan09/employee-frontend:latest